name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Benchmark
        run: go test ./tests/ -bench=. -benchmem -count=1 -run='^$'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build CLI
        run: go build -ldflags="-s -w" -o spine ./cmd/spine/

      - name: Verify CLI
        run: ./spine version

      - name: Parse example manifest
        run: ./spine parse examples/app.spine

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: spine-linux-amd64
          path: spine
